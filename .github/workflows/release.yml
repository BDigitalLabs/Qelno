name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.6.0 - leave empty to use current branch/tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Qelno.csproj

      - name: Execute test suite
        run: python3 tests/run_tests.py

  build:
    name: Build (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive_name: qelno-windows-x64.zip
            is_zip: true
          - rid: linux-x64
            archive_name: qelno-linux-x64.tar.gz
            is_zip: false
          - rid: osx-arm64
            archive_name: qelno-macos-arm64.tar.gz
            is_zip: false
          - rid: osx-x64
            archive_name: qelno-macos-x64.tar.gz
            is_zip: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file binary
        run: |
          dotnet publish Qelno.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./dist

      - name: Bundle licenses
        run: |
          cp LICENSE.txt NOTICE.txt ./dist/
          cp -r third_party_licenses ./dist/

      - name: Archive package
        run: |
          if [ "${{ matrix.is_zip }}" = "true" ]; then
            cd ./dist && zip -r ../${{ matrix.archive_name }} . && cd ..
          else
            chmod +x ./dist/Qelno
            tar -czvf ${{ matrix.archive_name }} -C ./dist .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.rid }}
          path: ${{ matrix.archive_name }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: ./release-assets

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ./release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
